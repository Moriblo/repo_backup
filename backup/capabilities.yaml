# =============================================================================
# Registro canônico de capabilities (capabilities.yaml)
# =============================================================================
# O QUE É
#   Fonte única, legível por máquina, das políticas e controles do backup:
#   quais capabilities existem, seu Mnemonic e workflow, as classes de objeto a
#   preservar, as rotas aprovadas, os controles temporais e de informação
#   protegida, e o registro de artefatos de implementação (com rastreabilidade).
#
# QUEM LÊ
#   O engine (menu e ECR), o dispatch_check.py (Mnemonic -> workflow),
#   o bkp_repo.py (classes do preflight) e o HITL (manutenção).
#
# COMO ESTÁ ORGANIZADO (de cima para baixo)
#   1. Vocabulários: rotas, estados, lacunas, preservação, estados temporais.
#   2. Políticas: alertas, preservação temporal (MRBI/CRR), informação protegida.
#   3. object_classes: cada classe de objeto do GitHub e como lê-la.
#   4. capabilities: o menu (backup_repository, backup_projects e informativas).
#   5. artifact_traceability + implementation_artifacts: artefatos que
#      implementam o sistema e a que capability cada um serve.
#
# REGRAS
#   - O texto normativo é o BACKUP_REPOSITORY.md; este arquivo o torna executável.
#   - Alterar aqui muda o comportamento do sistema: só por pull request.
#   - Nomes em MAIÚSCULAS são códigos usados por scripts e schemas; não os traduza.
# =============================================================================
schema_version: "2.0"

# Repositório de execução/controle. Nunca é a origem de um backup; só lê a origem e escreve no destino autorizado.
execution_repository: Moriblo/repo_backup

# Valores padrão que valem para toda capability de preservação.
# Todos existem para impedir que o engine 'adivinhe' ou amplie a autorização.
defaults:
  # A origem é SEMPRE somente leitura (regra 2 do protocolo).
  source_repository_mode: READ_ONLY
  # Parâmetro ausente nunca é inferido: o HITL informa ou confirma.
  infer_missing_parameters: false
  # Nenhum parâmetro é herdado de uma execução anterior.
  inherit_previous_execution_parameters: false
  # Um GO vale só para o Exact Command Request apresentado; não é reutilizável.
  authorization_reusable: false
  # Limitação de um conector/engine não reduz o escopo do backup; vira lacuna declarada.
  connector_limitation_reduces_scope: false
  # Não conseguir ler um objeto NÃO significa que ele não existe (regra 9).
  inability_to_read_means_absent: false

# Tipos de rota pelos quais um objeto pode ser lido. Cada rota é avaliada separadamente no Capability Preflight.
route_types:
  - ENGINE_NATIVE
  - CONNECTOR
  - GIT
  - REST_API
  - GRAPHQL_API
  - AUTHORIZED_API_IDENTITY
  - SPECIALIZED_CAPABILITY
  - DETERMINISTIC_EXECUTOR

# Mecanismos históricos de rota. WORKFLOW é preservado por compatibilidade e NÃO é sinônimo do resultado ROUTED.
historical_route_mechanisms:
  - WORKFLOW

# Estado de uma rota numa execução: disponível, parcial, indisponível, não aplicável ou não verificada.
route_states:
  - AVAILABLE
  - PARTIAL
  - UNAVAILABLE
  - NOT_APPLICABLE
  - NOT_VERIFIED

# Classificação das lacunas do Capability Preflight.
# blocking_or_restricting: lacunas MATERIAIS; exigem decisão do HITL (STOP ou CONTINUE_WITH_RESTRICTIONS).
# non_gap: fato que só o Source Inventory descobre; NUNCA entra em gaps[] nem aciona o HITL.
gap_classifications:
  blocking_or_restricting:
    - ARCHITECTURAL_GAP
    - EXECUTION_CAPABILITY_GAP
    - ACCESS_PERMISSION_GAP
  non_gap:
    - FACTUAL_INVENTORY_PENDING

# Resultado agregado da avaliação de rotas de uma classe de objeto.
routing_outcomes:
  - DIRECT
  - ROUTED
  - PARTIAL
  - LIMITATION

# Significado de cada resultado: DIRECT (rota direta basta), ROUTED (rota alternativa basta), PARTIAL (rotas combinadas cobrem em parte), LIMITATION (sem cobertura).
routing_model:
  direct_sufficient: DIRECT
  alternate_route_sufficient: ROUTED
  combined_routes_partial: PARTIAL
  unresolved: LIMITATION
  historical_workflow_rule: >
    WORKFLOW is preserved as a historical/specialized route mechanism
    and is not a synonym for the generalized ROUTED outcome.

# Estados finais possíveis de cada objeto material descoberto. Nenhum objeto pode ser omitido em silêncio.
preservation_states:
  - PRESERVED
  - PRESERVED-AS-EQUIVALENT-REPRESENTATION
  - PARTIALLY-PRESERVED
  - NON-EXPORTABLE
  - FAILED
  - NOT-VERIFIED

# Estados de objetos temporais (que expiram): disponível, expirado, apagado/indisponível ou não verificado.
temporal_states:
  - AVAILABLE
  - EXPIRED
  - DELETED_UNAVAILABLE
  - NOT_VERIFIED

# Alertas canônicos. Cada um tem uma classe e a regra que o dispara.
alerts:
  RETENTION_ALERT:
    class: TEMPORAL
    rule: >
      Emit when accepted deterministic-retention conditions indicate
      temporal-loss risk, including the governed MRBI/CRR control.
  VOLATILITY_ALERT:
    class: TEMPORAL
    rule: >
      Emit when a material NON-TIME-BOUND EVICTION RISK exists.
  ACCESSIBILITY_ALERT:
    class: ACCESSIBILITY
    rule: >
      Emit when a current access constraint may prevent Codespaces
      repository-state delta verification or preservation.

# Controles de preservação temporal: objetos que expiram têm prioridade sobre os estáveis assim que o backup é autorizado.
temporal_preservation:
  priority: BEFORE_STABLE_OBJECTS_WHEN_BACKUP_AUTHORIZED
  # MRBI: menor janela de retenção determinística entre as classes temporais descobertas. Risco de expulsão sem prazo NÃO vira número: gera VOLATILITY_ALERT.
  mrbi:
    name: Maximum Recommended Backup Interval
    rule: >
      MIN of applicable deterministic retention windows across all
      discovered temporal preservation classes.
    shorter_window_reduces_mrbi: true
    non_time_bound_eviction_is_numeric_mrbi: false
  # CRR: retenção efetiva lida do repositório e preservada como evidência. Nunca inferida de um padrão do produto.
  crr:
    name: Current Repository Retention
    rule: >
      Read and preserve the effective repository/applicable retention
      as evidence when applicable; never infer it from a default.
  # Classes temporais que o backup deve considerar.
  classes:
    - workflow_runs
    - workflow_attempts
    - jobs
    - steps
    - workflow_logs
    - actions_artifacts
    - check_suites
    - check_runs
    - commit_statuses
    - actions_caches
    - webhook_deliveries
    - other_discovered_temporal_state
  failed_semantics: >
    FAILED applies when preservation fails for material that was
    available during the authorized capture window.

# Regras para informação protegida (segredos etc.): metadados primeiro; texto puro nunca aparece em chat, log ou evidência.
protected_information:
  plaintext_required_for_architectural_completeness: false
  expose_plaintext_in_chat_logs_or_plaintext_evidence: false
  operation_specific_hitl_for_unapproved_plaintext_recovery: true
  preserve_when_evidenced:
    - identity
    - class
    - scope
    - owner
    - repository
    - environment
    - visibility_access_policy
    - consumers
    - repository_references
    - functional_destination
    - external_origin
    - external_object_identifier
    - authoritative_source
    - recoverability
    - value_preservation_status
    - provenance
    - reconstruction_reissuance_references
    - evidence
  # Como um valor protegido pode ser recuperado ou reconstruído.
  recoverability:
    - RECONSTRUCTIBLE
    - REISSUABLE
    - RECOVERABLE_FROM_AUTHORIZED_SOURCE
    - RUNTIME_ONLY_CANDIDATE
    - NOT_YET_DETERMINED

# Classes de objeto do GitHub que o backup_repository preserva.
# Campos comuns:
#   architectural_status  ROUTE_DEFINED (há rota aprovada), ARCHITECTURALLY_SOLVED (resolvido por
#                         combinação de rotas) ou OPEN_SET_CONTROL (controle O-24, sem lista fixa).
#   required_read_capabilities  o que precisa ser lido para preservar a classe.
#   approved_route_types  rotas aprovadas (ver route_types).
#   temporal: true        a classe expira e entra nos controles temporais.
#   protected_information / output_protected  a classe pode ter valores protegidos.
# NOTA: hoje o executor (backup-repository.yml) só implementa 'git'. As demais viram
# lacunas EXECUTION_CAPABILITY_GAP no preflight, aceitas como restrições pelo HITL.
object_classes:
  # Repositório Git: grafo de objetos completo, refs (inclusive de pull request), LFS e submódulos.
  git:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities:
      - enumerate_default_branch_branches_tags_and_material_refs
      - read_complete_git_object_graph
      - detect_git_lfs
      - detect_submodules
    approved_route_types: [GIT, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]
    preservation_requirements:
      - full_git_mirror
      - all_material_refs_including_pr_refs
      - detect_and_preserve_lfs_when_used
      - explicit_submodule_disposition
      - navigable_repository_tree
    verification_requirements:
      - compare_source_and_preserved_refs
      - compare_ref_target_shas
      - git_object_integrity_verification
      - verify_lfs_oids_sizes_and_hashes_when_applicable

  # Issues, comentários, reações, relações, eventos e responsáveis.
  issues:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [issues, comments, reactions, relationships, events, assignees]
    approved_route_types: [CONNECTOR, REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Pull requests: commits, arquivos, revisões, comentários, threads e refs de PR.
  pull_requests:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [pull_requests, commits, files, reviews, review_comments, threads, material_pr_refs]
    approved_route_types: [CONNECTOR, REST_API, GIT, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # GitHub Actions: definições de workflow, execuções, tentativas, jobs, passos, logs, artefatos e statuses. Temporal.
  actions:
    architectural_status: ROUTE_DEFINED
    temporal: true
    required_read_capabilities: [workflow_definitions, workflow_runs, workflow_attempts, jobs, steps, logs, artifacts, commit_statuses]
    approved_route_types: [CONNECTOR, REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Projects (v2). Pode exigir REST e GraphQL combinados, pois nenhuma superfície única é completa.
  projects:
    architectural_status: ARCHITECTURALLY_SOLVED
    required_read_capabilities:
      - project_identity_and_metadata
      - repository_relationships
      - fields_and_options
      - items
      - draft_issues
      - issue_and_pull_request_references
      - field_values
      - archived_item_state
      - views_when_exposed
      - workflows_automations_when_exposed
      - status_updates_when_exposed
      - other_discovered_project_state
    approved_route_types: [REST_API, GRAPHQL_API, AUTHORIZED_API_IDENTITY, SPECIALIZED_CAPABILITY, DETERMINISTIC_EXECUTOR]
    combined_surfaces_may_be_required: true
    preservation_representation:
      machine_readable: true
      schema_controlled: true
      reconstructible_equivalent: true
      downstream_reusable: true

  # Environments: inventário, regras de proteção, políticas de branch e metadados de secrets.
  environments:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [environment_inventory, protection_rules, branch_policies, readable_configuration, environment_variable_metadata_and_readable_values, secret_metadata]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Variáveis de Actions: nomes, valores legíveis, escopo e datas. Saída protegida.
  variables:
    architectural_status: ROUTE_DEFINED
    output_protected: true
    required_read_capabilities: [variable_inventory, names, readable_values, timestamps_when_exposed, scope]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Metadados de secrets. Informação protegida; o texto puro não é exigido nem exposto.
  secret_metadata:
    architectural_status: ROUTE_DEFINED
    protected_information: true
    required_read_capabilities: [enumerate_applicable_secret_metadata_classes, relationships, provenance_when_evidenced, recoverability_disposition]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, SPECIALIZED_CAPABILITY, DETERMINISTIC_EXECUTOR]
    plaintext_required: false

  # Deployments e seus statuses.
  deployments:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [deployments, deployment_statuses]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Rulesets e proteção de branch.
  rules_and_branch_protection:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [rulesets, branch_protection, required_checks_when_exposed, restrictions_when_exposed]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Colaboradores, permissões e convites.
  collaborators:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [collaborator_inventory, permissions, invitations_when_exposed]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Webhooks e entregas. As entregas são temporais. O segredo do webhook não é exportável; sistemas externos alcançados são só referência.
  webhooks:
    architectural_status: ROUTE_DEFINED
    temporal_components: [webhook_deliveries]
    protected_information: true
    required_read_capabilities:
      - webhook_identity
      - destination_when_readable
      - event_subscriptions
      - active_state
      - content_type
      - ssl_tls_configuration_when_exposed
      - other_readable_configuration
      - readable_delivery_evidence
      - secret_presence_and_metadata_when_observable
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]
    external_state_scope_expansion: false
    webhook_secret_plaintext:
      preservation_status: NON_EXPORTABLE_VALUE_REISSUABLE_WHEN_NOT_EXPOSED

  # Labels e suas propriedades.
  labels:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [label_inventory, label_properties]
    approved_route_types: [CONNECTOR, REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Milestones e suas propriedades.
  milestones:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities: [milestone_inventory, milestone_properties]
    approved_route_types: [CONNECTOR, REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Check suites, check runs e commit statuses. Temporal.
  checks:
    architectural_status: ROUTE_DEFINED
    temporal: true
    required_read_capabilities: [check_suites, check_runs, commit_statuses]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]

  # Caches de Actions. Temporal, com risco de expulsão sem prazo (VOLATILITY_ALERT).
  actions_caches:
    architectural_status: ROUTE_DEFINED
    temporal: true
    required_read_capabilities: [cache_inventory, effective_retention_when_exposed, cache_usage_when_exposed, cache_size_when_exposed, last_access_metadata_when_exposed]
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, DETERMINISTIC_EXECUTOR]
    non_time_bound_eviction_risk: true

  # Codespaces: só o delta de estado do repositório (commits não enviados, arquivos rastreados modificados e conteúdo não rastreado). O estado da VM fica fora.
  codespaces_repository_state_delta:
    architectural_status: ROUTE_DEFINED
    required_read_capabilities:
      - enumerate_codespaces_for_scope
      - assess_accessibility
      - verify_unpushed_commits
      - verify_modified_tracked_files
      - verify_untracked_repository_content
    approved_route_types: [REST_API, AUTHORIZED_API_IDENTITY, SPECIALIZED_CAPABILITY, DETERMINISTIC_EXECUTOR]
    preservation_object: REPOSITORY_STATE_DELTA_ONLY
    required_order: [discover, assess_accessibility, verify_repository_state_delta, record_evidence_and_state, evaluate_retention]
    official_export_alone_proves_completeness: false

  # Controle O-24: qualquer estado material novo descoberto deve ser classificado, receber rota ou disposição, ser evidenciado e reconciliado.
  other_discovered_state:
    architectural_status: OPEN_SET_CONTROL
    control_id: O-24
    required_behavior: [classify_new_material_state, assign_preservation_or_disposition_route, evidence_state, never_silently_omit]
    approved_route_types: [ENGINE_NATIVE, CONNECTOR, GIT, REST_API, GRAPHQL_API, AUTHORIZED_API_IDENTITY, SPECIALIZED_CAPABILITY, DETERMINISTIC_EXECUTOR]

# Menu de capabilities. As que têm `hitl_required: true` exigem GO do HITL.
# Só uma capability com `mnemonic` e `command_workflow` gera linha no commands.log
# (hoje, backup_repository e backup_projects).
capabilities:
  - id: backup_repository
    name: Backup Repository
    # Mnemonic: nome curto que o engine grava no commands.log (campo `mnemonic`) e que o
    # dispatcher mapeia, de forma FIXA, para um workflow. Um Mnemonic por capability executável.
    mnemonic: BKP_REPO
    # Workflow associado ao Mnemonic. Ele define INTEGRALMENTE o ECR (Exact Command Request):
    # os inputs do seu `on: workflow_call` mais as restrições descritas neles.
    command_workflow:
      # Único vínculo com o workflow: o `artifact_id` no registro de artefatos
      # (implementation_artifacts, no fim do arquivo). O CAMINHO do workflow não é repetido
      # aqui: ele vem de `implementation_artifacts[].location.path` (fonte única, SA-04).
      artifact_id: backup_repository_executor
      # Forma de chamada: reutilização de workflow (não workflow_dispatch), para que só o
      # dispatcher, disparado pelo commands.log, consiga executar o backup.
      invocation: workflow_call
      # Repassa os secrets do repositório ao workflow chamado (secrets de repositório/organização;
      # secrets de environment não são repassados por `inherit`).
      secrets: inherit
      # De onde o engine lê o ECR: dos inputs do workflow, e não deste arquivo.
      ecr_source: WORKFLOW_ON_WORKFLOW_CALL_INPUTS
      # Prefixo da linha que o workflow imprime no log do job com o desfecho em JSON.
      # O engine procura esta linha para reportar ao HITL (BACKUP_REPOSITORY.md, passo 6).
      result_log_marker: BKP_RESULT
    # Log de comandos autorizados: uma linha JSON por requisição, acrescentada no main SOMENTE
    # após o GO do HITL. É a única escrita direta permitida no main.
    command_log:
      # Arquivo do log (JSON Lines, append-only; não aceita comentários).
      path: commands.log
      # Schema que valida cada linha (envelope comum + params por Mnemonic).
      line_schema: backup/schemas/commands-log-line.schema.yaml
    # Classe da capability: execução de preservação (as outras são informativas ou de validação).
    class: PRESERVATION_EXECUTION
    # Exige GO do HITL antes de qualquer execução.
    hitl_required: true
    source_repository_mode: READ_ONLY
    # Executor determinístico. `artifact_id` liga ao registro de artefatos no fim do arquivo. `required_for_capability_definition: false` = a capability existe mesmo sem este executor.
    deterministic_executor:
      artifact_id: backup_repository_executor
      # Nome de referência do executor no vocabulário do protocolo. Deve ser "github_actions:" +
      # nome do arquivo do workflow (conferido por validate_traceability.py).
      reference: github_actions:backup-repository.yml
      required_for_capability_definition: false
    # Capability Preflight: roda APÓS o GO e ANTES do Source Inventory; avalia se a execução AUTORIZADA consegue ler tudo que importa.
    capability_preflight:
      required: true
      timing: AFTER_HITL_GO_BEFORE_SOURCE_INVENTORY
      assessment_target: EFFECTIVE_EXECUTION_CAPABILITY
      assess_route_types_separately: true
      gap_classifications: [ARCHITECTURAL_GAP, EXECUTION_CAPABILITY_GAP, ACCESS_PERMISSION_GAP, FACTUAL_INVENTORY_PENDING]
      factual_inventory_pending_is_gap: false
      material_gap_hitl_decisions: [STOP, CONTINUE_WITH_RESTRICTIONS]
      gap_report_requires: [object_class, unreadable_or_undiscoverable_scope, gap_classification, required_capability, routes_assessed, cause, preservation_impact, resulting_restriction]
      inability_to_read_means_absent: false
      accepted_restrictions_traceable: true
    # Parâmetros do comando. `source: HITL` = informado pelo humano; `HITL_OR_EXPLICIT_CONFIRMATION` = o engine pode propor, o HITL confirma.
    parameters:
      source_repository: {type: string, required: true, source: HITL}
      destination: {type: string, required: true, source: HITL_OR_EXPLICIT_CONFIRMATION}
      additional_parameters: {type: object, required: false, source: HITL_WHEN_APPLICABLE}
    # Classes de objeto (de object_classes) que este backup cobre.
    includes: [git, issues, pull_requests, actions, projects, environments, variables, secret_metadata, deployments, rules_and_branch_protection, collaborators, webhooks, labels, milestones, checks, actions_caches, codespaces_repository_state_delta, other_discovered_state]
    # Classes (de `includes`) que o executor JÁ sabe ler e preservar. É a fonte única: o preflight
    # (bkp_repo.py) calcula as restrições como `includes` menos `implemented_classes`.
    # Ao implementar uma classe, acrescente-a aqui: a restrição correspondente deixa de ser exigida.
    # labels, milestones e issues são lidas pela API por backup/scripts/github_api_read.py e
    # entram no pacote como api-*.json (representação equivalente, não restauração por git push).
    # projects é lida por backup/scripts/github_projects_read.py (GraphQL) e precisa de uma
    # credencial própria (ver `class_credentials`).
    implemented_classes: [git, labels, milestones, issues, projects]
    # Classes que, além do SOURCE_READ_TOKEN, exigem uma credencial PRÓPRIA. `secret` é o nome do
    # secret do environment; `outcome_env` é a variável com o resultado do passo do workflow que o
    # fornece. Sem ela, o preflight trata a classe como ACCESS_PERMISSION_GAP (restrição a aceitar),
    # em vez de falhar o backup do código. projects: token CLÁSSICO com `read:project`, porque token
    # fine-grained não alcança Projects v2 de conta pessoal (a confirmar no primeiro run real).
    class_credentials:
      projects: {secret: PROJECTS_READ_TOKEN, outcome_env: PROJECTS_TOKEN_OUTCOME}
    # Destino OneDrive pessoal (OAuth delegado, sem OIDC). Nada aqui é segredo: os valores
    # sensíveis ficam em secrets/variáveis do repositório (nomes abaixo).
    onedrive:
      # Autoridade de contas pessoais e escopo mínimo (pasta do app).
      authority: https://login.microsoftonline.com/consumers
      scope: "Files.ReadWrite.AppFolder offline_access"
      # Variável de repositório com o Client ID do registro no Entra (app público, sem client secret).
      client_id_variable: ONEDRIVE_CLIENT_ID
      # Environment do GitHub que guarda a variável e os secrets abaixo; o job do workflow o declara.
      environment: onedrive-backup
      # Secret com o refresh token. A rotação (regravar o token novo a cada execução) só ocorre
      # se o App Writer opcional estiver configurado; sem ele o token original vale até expirar.
      refresh_token_secret: ONEDRIVE_REFRESH_TOKEN
      # Secret com o token fine-grained de LEITURA da origem (Contents e Metadata).
      source_read_token_secret: SOURCE_READ_TOKEN
      # Layout no destino: <destination>/<request_id>/package/ (restaurável) e /evidence/.
      layout: "<destination>/<request_id>/{package,evidence}"

  # Backup de Projects. Chamável sozinho (Mnemonic BKP_PROJ) e também incluído pelo backup_repository.
  - id: backup_projects
    name: Backup Projects
    # Mnemonic que o engine grava no commands.log; o dispatcher o mapeia, de forma FIXA, para o workflow abaixo.
    mnemonic: BKP_PROJ
    command_workflow:
      # Único vínculo com o workflow: o `artifact_id` no registro de artefatos (o caminho vem de lá).
      artifact_id: backup_projects_executor
      invocation: workflow_call
      secrets: inherit
      ecr_source: WORKFLOW_ON_WORKFLOW_CALL_INPUTS
      result_log_marker: BKP_RESULT
    command_log:
      path: commands.log
      line_schema: backup/schemas/commands-log-line.schema.yaml
    class: PRESERVATION_EXECUTION
    hitl_required: true
    source_repository_mode: READ_ONLY
    deterministic_executor:
      artifact_id: backup_projects_executor
      reference: github_actions:backup-projects.yml
      # Não se sabe se este executor já existiu antes (informação que o registro sozinho não dá).
      historical_existence: NOT_DETERMINED
      required_for_capability_definition: false
    # Classes cobertas e implementadas: só `projects` (mesmo leitor do BKP_REPO). O preflight
    # (bkp_repo.py, com CAPABILITY_ID=backup_projects) calcula as restrições como `includes` menos `implemented_classes`.
    includes: [projects]
    implemented_classes: [projects]
    # Este backup não clona nem lê o código: o SOURCE_READ_TOKEN não é exigido pelo preflight
    # (no escopo SOURCE_REPOSITORY ele só alimenta a regra E, opcionalmente).
    source_read_token_required: false
    class_credentials:
      projects: {secret: PROJECTS_READ_TOKEN, outcome_env: PROJECTS_TOKEN_OUTCOME}
    # Relação com o backup_repository: Projects relacionados entram no backup do repositório; também pode ser chamado isoladamente.
    relationship_to_backup_repository:
      related_projects_included_by_backup_repository: true
      independently_callable: true
    # Rotas exigidas: REST e GraphQL, combinadas.
    required_routes: [REST_API, GRAPHQL_API]
    combined_surfaces_may_be_required: true
    preservation_representation:
      machine_readable: true
      schema_controlled: true
      reconstructible_equivalent: true
      downstream_reusable: true
      evidence_and_provenance_required: true
    parameters:
      # ATENÇÃO (provado no run req-20261003-005): OWNER_PROJECT_SET lê e grava TODOS os Projects
      # do dono, sem nenhum filtro, inclusive os que não têm relação com o repositório de teste.
      # O engine DEVE avisar isso no ECR, antes do GO, e perguntar se é isso mesmo que o HITL quer.
      # SOURCE_REPOSITORY só inclui Projects ligados à origem (vínculo visível ou confirmado pelos títulos).
      scope:
        type: enum
        values: [SOURCE_REPOSITORY, PROJECT, OWNER_PROJECT_SET]
        required: true
        source: HITL
      scope_identifiers: {type: object, required: true, source: HITL}
      destination: {type: string, required: true, source: HITL_OR_EXPLICIT_CONFIRMATION}
      additional_parameters: {type: object, required: false, source: HITL_WHEN_APPLICABLE}

  # Backup só de labels, milestones e issues de UM repositório. Chamável sozinho (Mnemonic BKP_ISSUES) e também incluído
  # pelo backup_repository. Mesmo leitor do BKP_REPO (github_api_read.py, API REST, só GET); sem clone, sem Projects,
  # sem pull requests. Um repositório por linha, de propósito.
  - id: backup_issues
    name: Backup Issues
    # Mnemonic que o engine grava no commands.log; o dispatcher o mapeia, de forma FIXA, para o workflow abaixo.
    mnemonic: BKP_ISSUES
    command_workflow:
      # Único vínculo com o workflow: o `artifact_id` no registro de artefatos (o caminho vem de lá).
      artifact_id: backup_issues_executor
      invocation: workflow_call
      secrets: inherit
      ecr_source: WORKFLOW_ON_WORKFLOW_CALL_INPUTS
      result_log_marker: BKP_RESULT
    command_log:
      path: commands.log
      line_schema: backup/schemas/commands-log-line.schema.yaml
    class: PRESERVATION_EXECUTION
    hitl_required: true
    source_repository_mode: READ_ONLY
    deterministic_executor:
      artifact_id: backup_issues_executor
      reference: github_actions:backup-issues.yml
      required_for_capability_definition: false
    # As três classes juntas: as issues citam etiquetas e marcos, e o leitor confere que todo item citado existe.
    # O preflight (bkp_repo.py, CAPABILITY_ID=backup_issues) calcula as restrições como `includes` menos `implemented_classes`.
    includes: [labels, milestones, issues]
    implemented_classes: [labels, milestones, issues]
    # Usa o SOURCE_READ_TOKEN (fine-grained, Issues: Read), o mesmo do BKP_REPO: sem ele, ACCESS_PERMISSION_GAP.
    relationship_to_backup_repository:
      related_issues_included_by_backup_repository: true
      independently_callable: true
    required_routes: [REST_API]
    preservation_representation:
      machine_readable: true
      schema_controlled: true
      reconstructible_equivalent: true
      downstream_reusable: true
      evidence_and_provenance_required: true
    parameters:
      source_repository: {type: string, required: true, source: HITL}
      destination: {type: string, required: true, source: HITL_OR_EXPLICIT_CONFIRMATION}
      additional_parameters: {type: object, required: false, source: HITL_WHEN_APPLICABLE}

  # Restauração de um backup do BKP_REPO (OneDrive) para um repositório NOVO do GitHub. Primeira capability que ESCREVE no
  # GitHub, por isso é a mais restritiva: o alvo é criado pelo workflow, sempre privado, nunca pode existir antes nem ser a
  # origem, e só recebe branches e tags (sem --force). Nesta etapa restaura SÓ a classe git; labels, milestones, issues e
  # Projects vêm em etapas seguintes. O RESTAURAR.txt de cada backup continua valendo como caminho manual.
  - id: restore_repository
    name: Restore Repository
    # Mnemonic que o engine grava no commands.log; o dispatcher o mapeia, de forma FIXA, para o workflow abaixo.
    mnemonic: RST_REPO
    command_workflow:
      # Único vínculo com o workflow: o `artifact_id` no registro de artefatos (o caminho vem de lá).
      artifact_id: restore_repository_executor
      invocation: workflow_call
      secrets: inherit
      ecr_source: WORKFLOW_ON_WORKFLOW_CALL_INPUTS
      result_log_marker: BKP_RESULT
    command_log:
      path: commands.log
      line_schema: backup/schemas/commands-log-line.schema.yaml
    class: PRESERVATION_EXECUTION
    hitl_required: true
    # O backup no OneDrive é só LIDO; a escrita é só no repositório novo que o workflow cria.
    source_repository_mode: READ_ONLY
    deterministic_executor:
      artifact_id: restore_repository_executor
      reference: github_actions:restore-repository.yml
      required_for_capability_definition: false
    # Classe coberta e implementada nesta etapa. O preflight (bkp_repo.py, CAPABILITY_ID=restore_repository) calcula as
    # restrições como `includes` menos `implemented_classes`.
    includes: [git]
    implemented_classes: [git]
    # A restauração lê o backup do OneDrive: não usa o SOURCE_READ_TOKEN.
    source_read_token_required: false
    # Credencial de ESCRITA no GitHub, amplo (fine-grained "todos os repositórios" com Administration, Contents e Workflows
    # em escrita, ou clássico `repo` se o GitHub não permitir criar repositório pessoal com fine-grained: a confirmar no
    # primeiro run real). Guardado no environment onedrive-backup, restrito à branch main. Sem ele: ACCESS_PERMISSION_GAP.
    class_credentials:
      git: {secret: RESTORE_WRITE_TOKEN, outcome_env: RESTORE_TOKEN_OUTCOME}
    # Regras do alvo (aplicadas pelo restore_repo.py; qualquer violação recusa a restauração, fail-closed).
    target_policy:
      name_default: "<nome da origem>-restaurado"
      owner: same_as_source
      visibility: private
      must_not_exist: true
      never_source: true
      refs_restored: [refs/heads/*, refs/tags/*]
      force_push: false
    parameters:
      # Pasta do backup no AppFolder: <destination>/<request_id do backup>. É o único parâmetro obrigatório.
      backup_path: {type: string, required: true, source: HITL}
      # Nome do repositório alvo (sem o dono). Opcional; sem ele, "<nome da origem>-restaurado".
      target_name: {type: string, required: false, source: HITL}
      additional_parameters: {type: object, required: false, source: HITL_WHEN_APPLICABLE}

  # Capabilities informativas e de validação: respondidas pelo engine na conversa; não têm Mnemonic nem workflow e nunca geram linha de comando.
  - {id: list_capabilities, name: List Capabilities, class: INFORMATIONAL, hitl_required: false}
  - {id: show_status, name: Show Status, class: INFORMATIONAL, hitl_required: false}
  - {id: validate_evidence, name: Validate Evidence, class: VALIDATION, hitl_required: false}
  - {id: help, name: Help, class: INFORMATIONAL, hitl_required: false}


# Regras de rastreabilidade capability <-> artefato de implementação (detalhes no BACKUP_REPOSITORY.md).
# Relação N:M, registrada uma vez em implementation_artifacts; a consulta inversa é derivada.
artifact_traceability:
  registry_authority: THIS_FILE
  registry_path: backup/capabilities.yaml
  model: CANONICAL_N_TO_M
  # Tipos de relação: EXECUTES (executa), VALIDATES (valida), SCHEMATIZES (define schema), CONFIGURES (configura), SUPPORTS (apoia).
  relationship_types: [EXECUTES, VALIDATES, SCHEMATIZES, CONFIGURES, SUPPORTS]
  # MATERIALIZED = o arquivo existe hoje; NOT_MATERIALIZED = registrado, mas ainda não existe.
  materialization_states: [MATERIALIZED, NOT_MATERIALIZED]
  # Estado de validação, distinto de existir. VALIDATED exige evidência registrada
  # (`validation.evidence` com URL do run e SHA completo do commit) e `validation.scope`.
  validation_states: [VALIDATED, NOT_VALIDATED, REVALIDATION_REQUIRED]
  # Política do SHA de cada artefato: TRACKED (current_sha obrigatório e conferido),
  # SELF_EXEMPT (o próprio registro, que não embute o próprio SHA) e MUTABLE_DATA (dados que
  # mudam a cada comando, como o commands.log).
  sha_policies: [TRACKED, SELF_EXEMPT, MUTABLE_DATA]
  # Ciclo de vida do artefato: ACTIVE (padrão), TEMPORARY (existe por um tempo) ou TO_BE_REMOVED.
  lifecycle_states: [ACTIVE, TEMPORARY, TO_BE_REMOVED]
  # Integridade: o SHA de blob Git do arquivo é o identificador da versão; o SHA do commit é a proveniência. Um artefato não embute o próprio SHA.
  integrity:
    materialized_version_identifier: GIT_BLOB_SHA
    change_provenance_identifier: GIT_COMMIT_SHA
    embedded_self_hash_required: false
    rule: >
      Resolve and compare the current Git blob SHA during traceability validation.
      A registry entry MUST NOT require an artifact to embed its own blob SHA.
  # Todo artefato MATERIALIZED precisa existir no caminho registrado; senão BROKEN_REFERENCE.
  referential_integrity:
    materialized_artifact_path_must_exist: true
    not_materialized_artifact_path_may_be_absent: true
    broken_reference_state: BROKEN_REFERENCE
  # Arquivo de implementação numa pasta gerenciada, sem artifact_id registrado, é ORPHAN_ARTIFACT.
  orphan_detection:
    required: true
    rule: >
      Any implementation artifact within a managed artifact location that is
      related to the capability system MUST have a registered artifact_id.
  # Ao mudar um artefato, as capabilities afetadas (derivadas das relações) voltam a exigir revalidação.
  impact_analysis:
    changed_artifact_requires_capability_lookup: true
    affected_capabilities_derived_from_relationships: true
    affected_capabilities_require_revalidation: true

# Artefatos que implementam o sistema. Campos:
#   artifact_id        identificador lógico estável (não muda quando o arquivo muda).
#   artifact_type      tipo (schema, protocolo, workflow, script...).
#   location           repositório e caminho.
#   lifecycle          (opcional) ACTIVE (padrão), TEMPORARY ou TO_BE_REMOVED.
#   materialization    MATERIALIZED ou NOT_MATERIALIZED.
#   integrity          como a versão é rastreada:
#                        current_sha  SHA de blob Git do arquivo (mantido por
#                                     `validate_traceability.py --update`).
#                        sha_policy   TRACKED (padrão: current_sha obrigatório),
#                                     SELF_EXEMPT (este arquivo: não embute o próprio SHA) ou
#                                     MUTABLE_DATA (arquivo de dados que muda a cada comando).
#   validation         estado de validação. VALIDATED exige `evidence` (lista de
#                      {run, commit}: URL do run no Actions e SHA completo do commit)
#                      e `scope` (o que foi e o que NÃO foi provado).
#   relationships      capabilities atendidas e tipo da relação.
# A conferência automática de tudo isto é feita por backup/scripts/validate_traceability.py.
implementation_artifacts:
  # ---------------------------------------------------------------------------
  # Este arquivo. Não embute o próprio SHA (regra do protocolo), por isso SELF_EXEMPT.
  # Foi lido por dispatch_check.py e bkp_repo.py em todos os runs reais.
  # ---------------------------------------------------------------------------
  - artifact_id: capability_registry
    artifact_type: CAPABILITY_REGISTRY
    location:
      repository: Moriblo/repo_backup
      path: backup/capabilities.yaml
    purpose: Canonical capability, routing, policy, and implementation-artifact registry.
    materialization:
      status: MATERIALIZED
    integrity:
      tracking: GIT_BLOB_SHA
      sha_policy: SELF_EXEMPT
    validation:
      status: VALIDATED
      scope: Lido pelo dispatcher e pelo preflight nos runs reais (Mnemonic, classes de objeto e artefatos). Regras de rastreabilidade ainda não conferidas em run.
