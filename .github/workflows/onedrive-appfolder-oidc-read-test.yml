name: OneDrive AppFolder OIDC Read Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment: onedrive-backup

    steps:
      - name: Azure login via GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire Microsoft Graph token
        id: graph
        shell: bash
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Set OneDrive drive ID
        id: drive
        shell: bash
        run: |
          set -euo pipefail
          echo "drive_id=4C330FBE76B815BB" >> "$GITHUB_OUTPUT"

      - name: Read OneDrive AppFolder
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph.outputs.token }}
          ONEDRIVE_DRIVE_ID: ${{ steps.drive.outputs.drive_id }}
        run: |
          set -euo pipefail

          response="$(
            curl --silent --show-error --fail-with-body \
              -H "Authorization: Bearer $GRAPH_TOKEN" \
              -H "Accept: application/json" \
              "https://graph.microsoft.com/v1.0/drives/${ONEDRIVE_DRIVE_ID}/special/approot"
          )"

          python -c '
          import json, sys
          d = json.load(sys.stdin)
          print(json.dumps({
              k: d.get(k)
              for k in ("id", "name", "webUrl")
          }, indent=2))
          ' <<< "$response"
