# =============================================================================
# Restore Repository (RST_REPO) - executor do Mnemonic RST_REPO
# =============================================================================
# O QUE É
#   Workflow que RESTAURA um backup do BKP_REPO (guardado no OneDrive) para um repositório NOVO do GitHub.
#   É o Mnemonic RST_REPO do capabilities.yaml (restore_repository -> RST_REPO). É a primeira escrita no
#   GitHub do sistema; por isso é fail-closed e só escreve no repositório que ele mesmo cria.
#
# COMO É ACIONADO
#   Apenas via `workflow_call`, pelo dispatcher.yml, depois que o HITL deu GO e o engine gravou uma linha em
#   commands.log. Sem `workflow_dispatch` de propósito.
#
# ECR (Exact Command Request)
#   Os `inputs` do `on: workflow_call` abaixo SÃO o ECR. O HITL só informa o caminho do backup no OneDrive:
#   a origem, o nome do alvo e os metadados saem do que foi salvo no backup.
#
# O QUE FAZ, E O QUE NÃO FAZ
#   Cria <dono da origem>/<nome da origem>-restaurado (ou target_name), SEMPRE PRIVADO, que NÃO pode existir antes
#   e NUNCA pode ser a origem; envia só refs/heads/* e refs/tags/* (sem --force) e o LFS; define a branch padrão e
#   confere as refs. Depois recria as labels e os milestones do mesmo backup (sem apagar nada; as labels padrão do
#   GitHub que não existem na origem ficam) e as issues com comentários (cópia equivalente, com @menções e referências
#   cruzadas neutralizadas e sem assignees) e confere o resultado. Sub-issues e dependências entre as issues restauradas voltam na classe relations (etapa 3b); Projects NÃO são restaurados nesta etapa
#   (o RESTAURAR.txt do backup explica o que fazer à mão). refs/pull/* não voltam (o GitHub não aceita).
#
# SEQUÊNCIA DOS PASSOS (não reordenar; ver BACKUP_REPOSITORY.md)
#   1. Revalidar inputs            -> rejeita valores fora do schema
#   2. Token de escrita            -> RESTORE_WRITE_TOKEN (secret do environment onedrive-backup); App Writer opcional
#   3. Capability Preflight        -> pode terminar BLOCKED (HITL decide)
#   4. Validar destino             -> OneDrive de verdade; falha fechada (saída 20)
#   5. Baixar e conferir o backup  -> SHA-256 de cada arquivo contra o manifest; só aceita BKP_REPO não FAILED
#   6. Restaurar                   -> cria o alvo privado, envia branches, tags e LFS, confere as refs
#   7. Evidência e manifest 2.0    -> validados contra os schemas; enviados ao OneDrive
#   8. Limpar e publicar           -> apaga o estado local; artefato do Actions (sempre)
#
# REGRAS QUE ESTE WORKFLOW RESPEITA
#   - O backup (OneDrive) é só LIDO. A origem do backup nunca é tocada.
#   - Só escreve no repositório que criou nesta execução; nunca com --force; nunca imprime o token.
#   - Se a restauração falhar no meio, o alvo parcial NÃO é apagado: o BKP_RESULT diz qual é.
#   - Sem OIDC: OneDrive por OAuth delegado. O refresh token gira a cada uso: NÃO rode dois comandos ao mesmo tempo.
#   - Sucesso do workflow NÃO prova restauração; a prova é o manifest validado e as refs conferidas.
# =============================================================================
name: Restore Repository (RST_REPO)

on:
  workflow_call:
    inputs:
      # Identificador único da requisição, vindo da linha do commands.log.
      request_id:
        description: "Unique request id from commands.log, 8-64 chars [A-Za-z0-9._-] (required)"
        required: true
        type: string
      # Pasta do backup no AppFolder: <destination>/<request_id do backup>, a mesma do BKP_REPO.
      backup_path:
        description: "OneDrive AppFolder-relative path of the backup to restore, <destination>/<backup request_id>, no leading slash and no '..' (required; READ-ONLY)"
        required: true
        type: string
      # Nome do repositório alvo (sem o dono). Vazio = "<nome da origem>-restaurado".
      target_name:
        description: "Name (without owner) of the NEW repository to create, [A-Za-z0-9_.-]{1,100}; empty means '<source name>-restaurado'. The target is always private, must not exist and can never be the source (optional)"
        required: false
        type: string
        default: ""
      preflight_decision:
        description: "JSON of the HITL CONTINUE_WITH_RESTRICTIONS decision (previous_request_id, hitl_decision, accepted_restrictions); empty on a first run (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  restore-repository:
    name: RST_REPO ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Environment que guarda ONEDRIVE_CLIENT_ID, ONEDRIVE_REFRESH_TOKEN e RESTORE_WRITE_TOKEN. Restrinja-o à branch main.
    environment: onedrive-backup
    env:
      # Faz o bkp_repo.py trabalhar com a capability restore_repository (validate-inputs, preflight, destino).
      CAPABILITY_ID: restore_repository
      REQUEST_ID: ${{ inputs.request_id }}
      BACKUP_PATH: ${{ inputs.backup_path }}
      TARGET_NAME: ${{ inputs.target_name }}
      # A evidência da restauração vai para <backup_path>/restores/<request_id>/evidence (não mexe no backup).
      DESTINATION: ${{ inputs.backup_path }}/restores
      PREFLIGHT_DECISION: ${{ inputs.preflight_decision }}
      EVIDENCE_DIR: evidence
      RESTORE_DIR: restore-work
      ONEDRIVE_SECRETS_ENVIRONMENT: onedrive-backup

    steps:
      - name: Checkout execution repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml jsonschema pynacl

      # Segunda barreira de validação (a primeira é do dispatcher): saída 2 e BKP_RESULT REJECTED.
      - name: Revalidate inputs
        shell: bash
        run: python3 backup/scripts/bkp_repo.py validate-inputs

      # Token de ESCRITA no GitHub: o secret RESTORE_WRITE_TOKEN. Se faltar, o passo falha SEM derrubar o job: o
      # preflight registra ACCESS_PERMISSION_GAP e o HITL decide. O valor só chega aos passos seguintes mascarado.
      - name: Provide restore write token (RESTORE_WRITE_TOKEN)
        id: restore_token
        continue-on-error: true
        shell: bash
        env:
          RESTORE_WRITE_TOKEN: ${{ secrets.RESTORE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RESTORE_WRITE_TOKEN" ]]; then
            echo "::warning::Secret RESTORE_WRITE_TOKEN ausente no environment onedrive-backup: a classe git ficará como restrição."
            exit 1
          fi
          echo "::add-mask::$RESTORE_WRITE_TOKEN"
          echo "token=$RESTORE_WRITE_TOKEN" >> "$GITHUB_OUTPUT"

      # OPCIONAL: App Writer para a rotação do refresh token do OneDrive (ver backup-repository.yml).
      - name: Issue secrets-writer token (GitHub App Writer)
        id: writer
        if: ${{ vars.REPOSITORY_PRESERVATION_SECRETS_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPOSITORY_PRESERVATION_SECRETS_APP_ID }}
          private-key: ${{ secrets.REPOSITORY_PRESERVATION_SECRETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-secrets: write
          permission-environments: write

      # Capability Preflight (APÓS o GO, ANTES de ler o backup). Saída 10 = BLOCKED: o HITL decide.
      - name: Capability Preflight
        id: preflight
        shell: bash
        env:
          RESTORE_TOKEN_OUTCOME: ${{ steps.restore_token.outcome }}
        run: python3 backup/scripts/bkp_repo.py preflight

      # Gate de destino (fail closed): prova escrita, leitura e remoção no OneDrive. Falha = saída 20.
      - name: Validate destination (fail closed before reading the backup)
        id: destination
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SECRETS_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 backup/scripts/bkp_repo.py validate-destination

      - name: Check git and git-lfs
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git lfs version

      # Baixa o backup do OneDrive e confere o SHA-256 de cada arquivo (nada é escrito no GitHub aqui). Falha não
      # derruba o job aqui: o build-evidence registra o FAILED e o último passo falha o job.
      - name: Fetch and verify the backup
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SECRETS_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 backup/scripts/restore_repo.py fetch

      # ÚNICO passo que escreve no GitHub: cria o repositório novo (privado), envia branches, tags e LFS e, depois de conferir
      # o git, recria as labels, os milestones e as issues com comentários do backup (sem apagar nada). Falha nelas: saída 48.
      # O token vai só como variável deste passo; o git o recebe por cabeçalho HTTP, nunca pela URL.
      - name: Create the new repository and restore
        id: restore
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RESTORE_TOKEN: ${{ steps.restore_token.outputs.token }}
        run: python3 backup/scripts/restore_repo.py restore

      - name: Build schema 2.0 evidence and manifest
        id: evidence
        if: always() && steps.destination.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DESTINATION_VALIDATED: ${{ steps.destination.outputs.destination_validated }}
        run: python3 backup/scripts/restore_repo.py build-evidence

      - name: Upload evidence to OneDrive
        if: always() && steps.destination.outcome == 'success'
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SECRETS_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        run: |
          set -euo pipefail
          rc=0
          python3 backup/scripts/onedrive.py upload --prefix "${DESTINATION}/${REQUEST_ID}/evidence" \
            --result "${RUNNER_TEMP}/onedrive-evidence-upload.json" --files "$EVIDENCE_DIR"/* || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            printf 'BKP_RESULT {"reason": "EVIDENCE_UPLOAD_FAILED", "request_id": "%s", "status": "FAILED"}\n' "$REQUEST_ID"
            exit "$rc"
          fi

      - name: Remove local OneDrive state
        if: always()
        shell: bash
        run: python3 backup/scripts/onedrive.py cleanup

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rst-repo-${{ inputs.request_id }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7

      # O job só termina em sucesso se o backup foi baixado, a restauração passou e a evidência foi gerada.
      - name: Fail the job if the restoration did not complete
        if: always() && (steps.fetch.outcome == 'failure' || steps.restore.outcome == 'failure' || steps.evidence.outcome == 'failure')
        shell: bash
        run: |
          echo "::error::A restauração não terminou: veja o BKP_RESULT FAILED (reason, target_repository) acima."
          exit 1
