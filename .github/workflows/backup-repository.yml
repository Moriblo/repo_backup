# =============================================================================
# Backup Repository (BKP_REPO) - executor do Mnemonic BKP_REPO
# =============================================================================
# O QUE É
#   Workflow que executa o backup de um repositório GitHub (origem, SOMENTE
#   LEITURA) para o OneDrive pessoal (destino). É o Mnemonic BKP_REPO do
#   capabilities.yaml (backup_repository -> BKP_REPO).
#
# COMO É ACIONADO
#   Apenas via `workflow_call`, pelo dispatcher.yml (PR 3), depois que o HITL
#   deu GO e o engine gravou uma linha em commands.log. Não há `workflow_dispatch`
#   de propósito: assim ninguém executa o backup sem passar pelo commands.log
#   (passo 4 do "Governed command flow" em BACKUP_REPOSITORY.md).
#
# ECR (Exact Command Request)
#   Os `inputs` do `on: workflow_call` abaixo SÃO o ECR: o engine lê este arquivo
#   e apresenta ao HITL exatamente estes campos e restrições. Se mudar um input,
#   o ECR muda - e é preciso nova autorização.
#
# SEQUÊNCIA DOS PASSOS (não reordenar; ver BACKUP_REPOSITORY.md)
#   1. Revalidar inputs            -> rejeita valores fora do schema
#   2. Tokens                      -> SOURCE_READ_TOKEN (leitura da origem) e App Writer opcional (rotação)
#   3. Capability Preflight        -> pode terminar BLOCKED (HITL decide)
#   4. Validar destino             -> OneDrive de verdade; falha fechada (saída 20)
#   5. Mirror Git + verificações   -> clone, comparação de refs, fsck, LFS, submódulos
#   6. Pacote restaurável          -> bundle de todas as refs + objetos LFS + lista de refs
#   7. Enviar o pacote ao OneDrive -> upload conferido por hash
#   8. Evidência e manifest 2.0    -> validados contra os schemas
#   9. Enviar a evidência          -> ao OneDrive, conferida por hash
#  10. Limpar e publicar           -> apaga o estado local; artefato do Actions (sempre)
#
# REGRAS QUE ESTE WORKFLOW RESPEITA
#   - A origem é READ-ONLY: nenhum passo executa push ou escrita na origem.
#   - Nenhum segredo é impresso; o token da origem só aparece em variável de
#     ambiente dos passos que o usam e nunca é gravado na config do mirror.
#   - Sem OIDC: o OneDrive usa OAuth delegado (Files.ReadWrite.AppFolder), pelo
#     onedrive.py. O refresh token gira a cada uso e o novo valor é gravado no secret
#     ANTES de qualquer outro uso do OneDrive; se a gravação falhar, tudo para.
#   - O BKP_RESULT que vale é o ÚLTIMO da execução (uma falha de envio, depois do
#     build-evidence, imprime um BKP_RESULT FAILED que substitui o anterior).
#   - Não dispare duas execuções ao mesmo tempo: ambas girariam o refresh token.
#   - Sucesso do workflow NÃO prova preservação; a prova é o manifest validado.
# =============================================================================
name: Backup Repository (BKP_REPO)

# ECR do BKP_REPO: os inputs abaixo são o Exact Command Request completo.
# As restrições conhecidas estão em cada `description` e são revalidadas no passo
# "Revalidate inputs". Chamado somente pelo dispatcher.yml (workflow_call).
on:
  workflow_call:
    inputs:
      # Identificador único da requisição, vindo da linha do commands.log.
      # Serve de chave de idempotência e nomeia o artefato de evidência.
      request_id:
        description: "Unique request id from commands.log, 8-64 chars [A-Za-z0-9._-] (required)"
        required: true
        type: string
      # Repositório a copiar, no formato dono/nome. Nunca é alterado (READ-ONLY).
      source_repository:
        description: "GitHub source repository in owner/name form, pattern ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ (required; READ-ONLY)"
        required: true
        type: string
      # Pasta de destino DENTRO do AppFolder do OneDrive (não é um caminho absoluto).
      destination:
        description: "OneDrive AppFolder-relative path, no leading slash and no '..' (required)"
        required: true
        type: string
      # Decisão do HITL após um BLOCKED de preflight. Vazio na 1ª execução.
      # Formato: {"previous_request_id": ..., "hitl_decision": "CONTINUE_WITH_RESTRICTIONS",
      #           "accepted_restrictions": [ {restriction_id, object_class, restriction, source_gap_classification}, ... ]}
      preflight_decision:
        description: "JSON of the HITL CONTINUE_WITH_RESTRICTIONS decision (previous_request_id, hitl_decision, accepted_restrictions); empty on a first run (optional)"
        required: false
        type: string
        default: ""

# Permissões do GITHUB_TOKEN: só leitura deste repositório (para o checkout).
# O acesso à ORIGEM não usa este token; usa o token do GitHub App (passo 2).
permissions:
  contents: read

jobs:
  backup-repository:
    name: BKP_REPO ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    # Limite de segurança contra execução presa; ajuste se repositórios grandes precisarem.
    timeout-minutes: 120
    # Environment que guarda ONEDRIVE_CLIENT_ID, ONEDRIVE_REFRESH_TOKEN e SOURCE_READ_TOKEN.
    # Secrets de environment só chegam ao job que declara o environment (não via `secrets: inherit`).
    # Se o environment tiver "Required reviewers", cada execução espera essa aprovação.
    environment: onedrive-backup
    # Variáveis comuns a todos os passos. Os inputs entram AQUI (e não direto em
    # `run:`) para evitar injeção de comando: o shell só os lê como variáveis.
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      DESTINATION: ${{ inputs.destination }}
      PREFLIGHT_DECISION: ${{ inputs.preflight_decision }}
      # Pasta do clone espelho (mirror) da origem.
      MIRROR_DIR: source.git
      # Pasta das evidências geradas; é o que o passo final publica.
      EVIDENCE_DIR: evidence
      # Onde onedrive.py grava o refresh token rotacionado (só usado se houver App Writer).
      ONEDRIVE_SECRETS_ENVIRONMENT: onedrive-backup

    steps:
      # Baixa ESTE repositório (execução/controle) para ter scripts e schemas.
      # Não é a origem do backup.
      # persist-credentials: false impede o checkout de gravar o cabeçalho Authorization do
      # GITHUB_TOKEN na configuração do git. Sem isso, o `git ls-remote` do passo de comparação de
      # refs (que roda neste diretório e envia o SOURCE_TOKEN) mandava DOIS cabeçalhos
      # Authorization e o GitHub respondia HTTP 400 "Duplicate header" (run do req-20260929-006).
      - name: Checkout execution repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Bibliotecas dos scripts: PyYAML (lê capabilities/schemas), jsonschema (valida) e
      # PyNaCl (o GitHub exige "sealed box" para gravar o secret do refresh token).
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml jsonschema pynacl

      # Segunda barreira de validação (a primeira é do dispatcher). Falha com
      # saída 2 e BKP_RESULT REJECTED se algum input violar o schema da linha
      # do commands.log.
      - name: Revalidate inputs
        shell: bash
        run: python3 backup/scripts/bkp_repo.py validate-inputs

      # Separa "dono/nome" em duas saídas, pois o passo do token pede as duas
      # partes separadas. Seguro: a validação anterior garante o formato.
      - name: Split source repository
        id: src
        shell: bash
        run: |
          set -euo pipefail
          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      # Token de LEITURA da origem: o secret SOURCE_READ_TOKEN do environment onedrive-backup
      # (token fine-grained, Contents e Metadata somente leitura). Este passo só confere que o
      # secret existe e o entrega aos passos seguintes como saída mascarada (`::add-mask::`).
      # `continue-on-error: true`: se faltar, o workflow NÃO cai aqui; o preflight registra a
      # lacuna ACCESS_PERMISSION_GAP e o HITL decide.
      - name: Provide read-only source token (SOURCE_READ_TOKEN)
        id: token
        continue-on-error: true
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_READ_TOKEN" ]]; then
            echo "::error::Secret SOURCE_READ_TOKEN ausente no environment onedrive-backup."
            exit 1
          fi
          echo "::add-mask::$SOURCE_READ_TOKEN"
          echo "token=$SOURCE_READ_TOKEN" >> "$GITHUB_OUTPUT"

      # Token da classe PROJECTS (GitHub Projects v2). É um token CLÁSSICO com o escopo
      # `read:project` (somente leitura), porque token fine-grained não alcança Projects v2 de
      # conta pessoal. Fica num secret próprio (PROJECTS_READ_TOKEN) para o SOURCE_READ_TOKEN
      # continuar fine-grained. Se faltar, este passo falha SEM derrubar o job (continue-on-error):
      # o preflight lê o resultado (PROJECTS_TOKEN_OUTCOME) e a classe projects vira
      # ACCESS_PERMISSION_GAP (restrição a aceitar pelo HITL), e o backup do código segue.
      - name: Provide Projects read token (PROJECTS_READ_TOKEN)
        id: projects_token
        continue-on-error: true
        shell: bash
        env:
          PROJECTS_READ_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PROJECTS_READ_TOKEN" ]]; then
            echo "::warning::Secret PROJECTS_READ_TOKEN ausente no environment onedrive-backup: a classe projects ficará como restrição."
            exit 1
          fi
          echo "::add-mask::$PROJECTS_READ_TOKEN"
          echo "token=$PROJECTS_READ_TOKEN" >> "$GITHUB_OUTPUT"

      # OPCIONAL. Emite um token do GitHub App Writer, limitado a ESCREVER SECRETS neste
      # repositório (permission-secrets: write), só para regravar o novo refresh token do
      # OneDrive (rotação). Só roda se a variável REPOSITORY_PRESERVATION_SECRETS_APP_ID existir.
      # Sem o Writer a rotação fica DESLIGADA (aviso no log): o refresh token original vale
      # até expirar (cerca de 90 dias) e então é preciso repetir o onedrive_authorize.py.
      # Se o Writer estiver configurado e falhar, o gate de destino falha fechado (saída 20).
      # Dependências: variável REPOSITORY_PRESERVATION_SECRETS_APP_ID e secret
      # REPOSITORY_PRESERVATION_SECRETS_APP_PRIVATE_KEY.
      - name: Issue secrets-writer token (GitHub App Writer)
        id: writer
        if: ${{ vars.REPOSITORY_PRESERVATION_SECRETS_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPOSITORY_PRESERVATION_SECRETS_APP_ID }}
          private-key: ${{ secrets.REPOSITORY_PRESERVATION_SECRETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-secrets: write
          # Secret de ENVIRONMENT: ler a chave pública exigiu Environments (read) (run -004) e
          # gravar o valor exige Environments (write) (run -005: "environments=write").
          permission-environments: write

      # Capability Preflight: roda APÓS o GO e ANTES de qualquer Source Inventory.
      # Saídas: 0 = segue; 10 = BLOCKED (lacunas materiais sem decisão do HITL).
      # Quando BLOCKED, os passos seguintes são pulados e o job termina em falha
      # de propósito; o engine lê `required_restrictions` na linha BKP_RESULT e
      # pede ao HITL STOP ou CONTINUE_WITH_RESTRICTIONS.
      - name: Capability Preflight
        id: preflight
        shell: bash
        env:
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          PROJECTS_TOKEN_OUTCOME: ${{ steps.projects_token.outcome }}
        run: python3 backup/scripts/bkp_repo.py preflight

      # Gate de destino (fail closed). Renova o token do OneDrive, GRAVA o novo refresh
      # token no secret (rotação) e prova que dá para escrever, ler e apagar um arquivo de
      # teste em <AppFolder>/<destination>/<request_id>/. Qualquer falha, inclusive
      # configuração ausente (Client ID, refresh token, token do Writer), termina em saída 20
      # com BKP_RESULT BLOCKED, e a origem nem chega a ser lida.
      - name: Validate destination (fail closed before Source Inventory)
        id: destination
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SECRETS_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 backup/scripts/bkp_repo.py validate-destination

      # Confirma que git e git-lfs existem no runner (ubuntu-latest já os traz).
      - name: Install Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git lfs version

      # Clona a origem com semântica de espelho completo (todas as refs, incluindo
      # as de pull request). O token vai por GIT_CONFIG_* (cabeçalho HTTP) apenas
      # neste processo: não aparece na URL, nos logs nem na config do mirror.
      - name: Clone source with full mirror semantics
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          # Source operation is intentionally fetch/clone-only. No push command or
          # source mutation operation is present in this executor.
          git clone --mirror "https://github.com/${SOURCE_REPOSITORY}.git" "$MIRROR_DIR"

      # Reconciliação de refs: compara as refs e os SHAs da ORIGEM (git ls-remote) com os do
      # mirror recém-clonado. Qualquer diferença é falha (saída 7): o mirror não pode ser
      # dado como completo. Refs que a origem recebeu ENTRE o clone e esta consulta também
      # aparecem como diferença; nesse caso, dispare o backup de novo.
      # Ignora a linha HEAD e as linhas "peeled" (^{}) do ls-remote, que não são refs reais.
      - name: Compare source refs with mirror refs
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          mkdir -p "$EVIDENCE_DIR"
          git ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" | awk '$2 != "HEAD" && $2 !~ /\^\{\}$/ {print $2 "\t" $1}' | sort > "$EVIDENCE_DIR/refs-source.tsv"
          git -C "$MIRROR_DIR" for-each-ref --format='%(refname)%09%(objectname)' | sort > "$EVIDENCE_DIR/refs-mirror.tsv"
          if diff "$EVIDENCE_DIR/refs-source.tsv" "$EVIDENCE_DIR/refs-mirror.tsv" > "$EVIDENCE_DIR/refs-compare.txt"; then
            echo "IDENTICAL: $(wc -l < "$EVIDENCE_DIR/refs-source.tsv") refs" | tee "$EVIDENCE_DIR/refs-compare.txt"
          else
            echo "::error::Source refs differ from mirror refs (see refs-compare.txt)."
            cat "$EVIDENCE_DIR/refs-compare.txt"
            exit 7
          fi

      # Evidência de integridade do mirror:
      #   refs.tsv              lista de refs com SHA e tipo (base da reconciliação)
      #   git-fsck.txt          verificação completa dos objetos (falha = job falha)
      #   git-count-objects.txt tamanho/contagem dos objetos
      - name: Validate refs and Git object database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git -C "$MIRROR_DIR" for-each-ref             --format='%(refname)%09%(objectname)%09%(objecttype)'             | sort > "$EVIDENCE_DIR/refs.tsv"
          git -C "$MIRROR_DIR" fsck --full --strict             > "$EVIDENCE_DIR/git-fsck.txt" 2>&1
          git -C "$MIRROR_DIR" count-objects -vH             > "$EVIDENCE_DIR/git-count-objects.txt"

      # Detecta e verifica Git LFS em todas as refs. Se houver objetos LFS, baixa
      # todos e confere o SHA-256 de cada um contra o OID.
      # Códigos de saída: 3 = não conseguiu listar LFS; 4 = OID inválido;
      #                   5 = objeto LFS ausente; 6 = hash não confere.
      # Sem LFS: registra isso explicitamente (ausência comprovada, não presumida).
      - name: Detect and validate Git LFS
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          mkdir -p "$EVIDENCE_DIR"
          cd "$MIRROR_DIR"

          git lfs ls-files --all --long > "../$EVIDENCE_DIR/lfs-files.txt" || {
            echo "::error::Unable to enumerate Git LFS pointers across refs."
            exit 3
          }

          if [[ -s "../$EVIDENCE_DIR/lfs-files.txt" ]]; then
            echo "LFS_APPLICABLE=true" >> "$GITHUB_ENV"
            git lfs fetch --all 2>&1 | tee "../$EVIDENCE_DIR/lfs-fetch.txt"

            awk '{print $1}' "../$EVIDENCE_DIR/lfs-files.txt" | sort -u               > "../$EVIDENCE_DIR/lfs-oids.txt"

            : > "../$EVIDENCE_DIR/lfs-verification.tsv"
            while IFS= read -r oid; do
              [[ "$oid" =~ ^[0-9a-fA-F]{64}$ ]] || {
                printf '%s\tINVALID_OID\n' "$oid" >> "../$EVIDENCE_DIR/lfs-verification.tsv"
                exit 4
              }
              object=".git/lfs/objects/${oid:0:2}/${oid:2:2}/$oid"
              # Bare repositories may use either <mirror>/lfs or <mirror>/.git/lfs
              # depending on Git LFS version/configuration.
              [[ -f "$object" ]] || object="lfs/objects/${oid:0:2}/${oid:2:2}/$oid"
              if [[ ! -f "$object" ]]; then
                printf '%s\tMISSING\n' "$oid" >> "../$EVIDENCE_DIR/lfs-verification.tsv"
                exit 5
              fi
              actual="$(sha256sum "$object" | awk '{print $1}')"
              if [[ "$actual" != "$oid" ]]; then
                printf '%s\tHASH_MISMATCH\t%s\n' "$oid" "$actual"                   >> "../$EVIDENCE_DIR/lfs-verification.tsv"
                exit 6
              fi
              size="$(stat -c '%s' "$object")"
              printf '%s\tVERIFIED\t%s\n' "$oid" "$size"                 >> "../$EVIDENCE_DIR/lfs-verification.tsv"
            done < "../$EVIDENCE_DIR/lfs-oids.txt"
          else
            echo "LFS_APPLICABLE=false" >> "$GITHUB_ENV"
            printf 'No Git LFS pointers discovered across reachable refs.\n'               > "../$EVIDENCE_DIR/lfs-fetch.txt"
            : > "../$EVIDENCE_DIR/lfs-oids.txt"
            : > "../$EVIDENCE_DIR/lfs-verification.tsv"
          fi

      # Procura submódulos em TODO o histórico alcançável (não só no commit atual):
      #   gitmodules-history.tsv  commits que possuem .gitmodules
      #   gitlinks-history.tsv    entradas de modo 160000 (gitlinks) por commit
      # Arquivos vazios significam "nenhum encontrado". O conteúdo dos submódulos
      # NÃO é copiado; se houver gitlinks, o manifest marca PARTIALLY-PRESERVED.
      - name: Detect submodules across reachable history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          : > "$EVIDENCE_DIR/gitmodules-history.tsv"
          : > "$EVIDENCE_DIR/gitlinks-history.tsv"

          while IFS= read -r commit; do
            if git -C "$MIRROR_DIR" cat-file -e "$commit:.gitmodules" 2>/dev/null; then
              printf '%s\t.gitmodules\n' "$commit"                 >> "$EVIDENCE_DIR/gitmodules-history.tsv"
            fi
            git -C "$MIRROR_DIR" ls-tree -r "$commit"               | awk -v c="$commit" '$1=="160000" {print c "\t" $0}'               >> "$EVIDENCE_DIR/gitlinks-history.tsv"
          done < <(git -C "$MIRROR_DIR" rev-list --all)

          sort -u -o "$EVIDENCE_DIR/gitmodules-history.tsv"             "$EVIDENCE_DIR/gitmodules-history.tsv"
          sort -u -o "$EVIDENCE_DIR/gitlinks-history.tsv"             "$EVIDENCE_DIR/gitlinks-history.tsv"

      # Lê pela API as classes labels, milestones e issues da origem (SOMENTE GET) e grava
      # package/api-*.json (+ api-inventory.json) e evidence/api-status.json. Cada classe é
      # conferida (abertos x open_issues_count, comentários por issue, etiquetas e marcos
      # citados). Este passo NÃO derruba o job quando uma classe falha: o resultado fica no
      # api-status.json e o build-evidence marca a classe FAILED (o job termina em falha ao
      # final), depois de o pacote Git já ter sido enviado. O token precisa de Issues: Read.
      - name: Read API object classes (labels, milestones, issues)
        # Rede de segurança (como no passo de Projects): sem api-status.json o build-evidence marca FAILED.
        continue-on-error: true
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p package "$EVIDENCE_DIR"
          python3 backup/scripts/github_api_read.py read

      # Lê pela API GraphQL os Projects (v2) LIGADOS ao repositório de origem (escopo
      # SOURCE_REPOSITORY) e grava package/api-projects*.json e evidence/api-projects-status.json.
      # Só roda se o token de Projects foi fornecido. Como o passo das outras classes de API, NÃO
      # derruba o job quando a classe falha ou fica parcial (itens ocultos para o token): o
      # resultado vai no api-projects-status.json e o build-evidence decide a disposição
      # (PRESERVED-AS-EQUIVALENT-REPRESENTATION, PARTIALLY-PRESERVED ou FAILED).
      - name: Read Projects linked to the source repository
        if: steps.projects_token.outcome == 'success'
        # Rede de segurança: o leitor já trata exceções, mas uma falha dele nunca pode impedir o
        # envio do pacote Git. Sem api-projects-status.json, o build-evidence marca a classe FAILED.
        continue-on-error: true
        shell: bash
        env:
          PROJECTS_TOKEN: ${{ steps.projects_token.outputs.token }}
          PROJECTS_SCOPE: SOURCE_REPOSITORY
        run: |
          set -euo pipefail
          mkdir -p package "$EVIDENCE_DIR"
          export PROJECTS_SCOPE_IDS="$(python3 -c 'import json,os; print(json.dumps({"source_repository": os.environ["SOURCE_REPOSITORY"]}))')"
          python3 backup/scripts/github_projects_read.py read

      # Monta o PACOTE RESTAURÁVEL em package/:
      #   source.bundle   git bundle de TODAS as refs (verificado com `git bundle verify`)
      #   lfs-objects.tar objetos Git LFS (o bundle não os carrega); só se a origem usa LFS
      #   refs.tsv        lista das refs e dos SHAs preservados, para conferência
      #   api-*.json      labels, milestones, issues e projects lidos pelos passos anteriores (já estão em package/)
      #   arquivos-<branch>.zip  INSTANTÂNEO LEGÍVEL: os arquivos da branch padrão (HEAD do mirror)
      #                   no estado atual, para abrir sem git. NÃO é a base da restauração (o
      #                   bundle é): não tem histórico e, se a origem usa LFS, pode trazer só os ponteiros ou o
      #                   conteúdo real (depende do LFS do runner; a confirmar no teste real).
      #   RESTAURAR.txt   como restaurar para um repositório novo e vazio
      # Códigos de saída: 8 = objetos LFS não encontrados no mirror; 9 = instantâneo não gerado.
      - name: Build restorable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          git -C "$MIRROR_DIR" bundle create "$PWD/package/source.bundle" --all
          git -C "$MIRROR_DIR" bundle verify "$PWD/package/source.bundle"
          if [[ "${LFS_APPLICABLE:-false}" == "true" ]]; then
            lfs_dir=""
            for d in "$MIRROR_DIR/lfs" "$MIRROR_DIR/.git/lfs"; do
              if [[ -d "$d/objects" ]]; then lfs_dir="$d"; fi
            done
            if [[ -z "$lfs_dir" ]]; then
              echo "::error::Git LFS objects not found in the mirror."
              exit 8
            fi
            tar -C "$(dirname "$lfs_dir")" -cf package/lfs-objects.tar "$(basename "$lfs_dir")/objects"
          fi
          cp "$EVIDENCE_DIR/refs.tsv" package/refs.tsv
          # Instantâneo legível da branch padrão. `git archive` lê o mirror (nada é escrito nele).
          # O nome da branch vira parte do arquivo, com "/" trocado por "_".
          default_branch="$(git -C "$MIRROR_DIR" symbolic-ref --short HEAD)"
          snapshot="package/arquivos-${default_branch//\//_}.zip"
          if ! git -C "$MIRROR_DIR" archive --format=zip -o "$PWD/$snapshot" HEAD; then
            echo "::error::Não foi possível gerar o instantâneo da branch padrão."
            exit 9
          fi
          cat > package/RESTAURAR.txt <<'EOF'
          ROTEIRO DE RESTAURACAO - backup de @ORIGEM@ (pedido @PEDIDO@)

          O QUE HA NESTA PASTA
            source.bundle          Copia completa do repositorio (todos os commits, branches,
                                   tags e arquivos), em formato git. E a BASE da restauracao.
            refs.tsv               Lista das refs e dos SHAs preservados (para conferir).
            arquivos-<branch>.zip  Instantaneo LEGIVEL da branch padrao: abre sem git. Sem
                                   historico; com Git LFS pode trazer so os ponteiros ou o conteudo real. NAO restaura.
            lfs-objects.tar        (so se a origem usa Git LFS) objetos LFS, que o bundle nao leva.
            api-*.json             Registro das labels, milestones e issues (JSON da API do
                                   GitHub), com api-inventory.json (contagens e SHA-256). E
                                   REGISTRO: o git push NAO os restaura (ver abaixo).
            api-projects*.json     (so se o backup leu Projects) Projects v2 ligados ao
                                   repositorio: campos, views, itens e valores. Tambem REGISTRO.
            repo-metadata.json     Visibilidade, descricao, topicos e branch padrao do repositorio
                                   no momento do backup (usado pela restauracao automatica).

          DUAS FORMAS DE RESTAURAR
            AUTOMATICA (opcional): a capability restore_repository do repo_backup (comando RST_REPO)
              restaura este backup sozinha. Voce informa so a pasta deste backup no OneDrive; o
              workflow confere os hashes, cria o repositorio NOVO e PRIVADO "<nome>-restaurado",
              envia branches, tags e LFS e confere as refs. Cobre SO o codigo (git). Labels,
              milestones, issues e Projects NAO sao restaurados por ela (ainda).
            MANUAL: o roteiro abaixo. Funciona sem o repo_backup, sem o GitHub Actions e sem token
              guardado em lugar nenhum; e o plano B quando a restauracao automatica nao estiver
              disponivel. Os dois levam ao mesmo resultado para o codigo.

          ANTES DE COMECAR (o que voce precisa fazer com as proprias maos)
            - Restaure para um repositorio NOVO e VAZIO. Nunca sobre o repositorio original.
            - Instale o git (e o git-lfs se existir lfs-objects.tar). Use bash (Git Bash no Windows).
            - Se o terminal mostrar "^[[200~" ou "~" colados em volta do comando e der "command not
              found", a colagem trouxe marcas invisiveis: cole com o botao direito do mouse ou
              digite o comando.
            - Baixe TODOS os arquivos desta pasta (package) do OneDrive para uma pasta local
              vazia, por exemplo "restauro", e abra o terminal dentro dela. Baixe tambem
              manifest.json, da pasta evidence ao lado.
            - Confira os arquivos baixados: cada arquivo do pacote tem o SHA-256 registrado em
              manifest.json (campo "artifacts", "sha256"). Compare com o que voce baixou:
                 sha256sum source.bundle refs.tsv
              Se algum valor for diferente, o download esta corrompido: baixe de novo.
            - Tenha em maos uma forma de autenticar no GitHub para ENVIAR (passo 5): o proprio
              git abre o login no navegador, ou use um token pessoal (GitHub > Settings >
              Developer settings > Personal access tokens) com permissao de escrita em
              "Contents" no repositorio novo. O token vale como senha: nunca o cole em chat,
              arquivo ou log.

          PASSO A PASSO
            1. Clone o bundle como espelho:
                 git clone --mirror source.bundle restaurado.git
            2. Confira o bundle (o "verify" precisa rodar DENTRO de um repositorio; deve
               terminar com "okay"):
                 git -C restaurado.git bundle verify ../source.bundle
            3. Compare as refs restauradas com o refs.tsv (nao deve haver diferenca):
                 git -C restaurado.git for-each-ref --format='%(refname)%09%(objectname)%09%(objecttype)' | sort > refs-restauradas.tsv
                 sort refs.tsv > refs-originais.tsv
                 diff refs-originais.tsv refs-restauradas.tsv && echo IGUAIS
            4. No GitHub (github.com > "+" > New repository): escolha o dono, o nome (por
               exemplo NOME_restaurado) e a visibilidade; deixe TODAS as opcoes de arquivos
               iniciais desmarcadas (sem README, sem licenca, sem .gitignore) e clique em
               Create repository. O repositorio precisa nascer vazio e com um nome que ainda
               NAO exista (nao reuse o de uma restauracao anterior).
               A partir daqui, em TODOS os comandos com URL, troque DONO/NOME_restaurado pelo
               dono e pelo nome do repositorio que voce acabou de criar.
            5. Entre no clone: cd restaurado.git
               Se existir lfs-objects.tar, extraia-o AGORA, dentro de restaurado.git (cria
               lfs/objects), antes de enviar:
                 tar -xf ../lfs-objects.tar
            6. Envie branches e tags DIRETO para a URL do repositorio novo (o remote "origin" de
               um clone --mirror recusa refspecs, por isso nao o use):
                 git push https://github.com/DONO/NOME_restaurado.git 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
               Se pedir usuario e senha: usuario = seu login do GitHub; senha = o token pessoal.
               NAO envie refs/pull/*: o GitHub as gerencia e nao aceita o envio.
               Se existir lfs-objects.tar, envie tambem os objetos LFS (so depois da extracao):
                 git lfs push --all https://github.com/DONO/NOME_restaurado.git
            7. Volte a pasta anterior (cd ..) e confira no GitHub: as branches e tags existem e o
               ultimo commit de cada branch tem o mesmo SHA do refs.tsv (compare com: git ls-remote URL-DO-REPOSITORIO-NOVO).
               Para comparar os arquivos com o arquivos-<branch>.zip: extraia o zip numa pasta
               (unzip arquivos-<branch>.zip -d zip-conf), clone o repositorio novo (git clone URL
               conf-restaurado) e rode:
                 diff -r --exclude=.git --strip-trailing-cr zip-conf conf-restaurado && echo ARQUIVOS-IGUAIS
               O --strip-trailing-cr e necessario no Windows: o git troca o fim de linha (LF por
               CRLF) ao clonar, e sem ele todas as linhas de arquivos de texto aparecem como
               diferentes. Com Git LFS o zip pode trazer o conteudo real ou so os ponteiros: se o
               diff apontar diferenca apenas nos arquivos LFS, e isso.
               Com LFS, confira que o arquivo LFS restaurado tem o tamanho real, e nao o de um
               ponteiro (~130 bytes): ls -la conf-restaurado/NOME-DO-ARQUIVO-LFS

          O QUE ESTE BACKUP NAO RESTAURA
            Labels, milestones, issues (com comentarios, eventos e reacoes) e Projects estao no
            pacote como REGISTRO (api-*.json e api-projects*.json), mas o git push NAO os recria
            no GitHub: a restauracao pela API ainda nao existe. Pull requests, actions, environments, variaveis,
            metadados de secrets, deployments, regras de protecao, colaboradores, webhooks,
            checks, caches e demais estados do GitHub fora do Git NAO estao neste pacote (ver
            preflight.json e manifest.json na pasta evidence). Segredos nunca sao preservados.
          EOF
          sed -i "s|@ORIGEM@|${SOURCE_REPOSITORY}|; s|@PEDIDO@|${REQUEST_ID}|" package/RESTAURAR.txt

      # Envia o pacote ao OneDrive em <destination>/<request_id>/package/ e confere o hash de
      # cada arquivo. Grava evidence/onedrive-package.json (o build-evidence lê esta lista).
      # Falha: imprime BKP_RESULT FAILED (PACKAGE_UPLOAD_FAILED) e sai com o código do
      # onedrive.py (22 = envio ou hash; 23 = autenticação ou rotação do secret).
      - name: Upload package to OneDrive
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SECRETS_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        run: |
          set -euo pipefail
          rc=0
          python3 backup/scripts/onedrive.py upload --prefix "${DESTINATION}/${REQUEST_ID}/package" \
            --result "$EVIDENCE_DIR/onedrive-package.json" --files package/* || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            printf 'BKP_RESULT {"reason": "PACKAGE_UPLOAD_FAILED", "request_id": "%s", "status": "FAILED"}\n' "$REQUEST_ID"
            exit "$rc"
          fi

      # Gera evidence.json e manifest.json (schemas 2.0), valida ambos e imprime
      # a linha BKP_RESULT (COMPLETE, COMPLETE_WITH_EXCEPTIONS ou FAILED).
      # Só roda se o destino foi validado (senão sai com 21). O manifest lista os arquivos
      # do pacote com o caminho no OneDrive, o SHA-256 e o tamanho.
      - name: Build schema 2.0 evidence and manifest
        shell: bash
        env:
          DESTINATION_VALIDATED: ${{ steps.destination.outputs.destination_validated }}
        run: python3 backup/scripts/bkp_repo.py build-evidence

      # Envia a evidência (evidence.json, manifest.json, preflight.json, listas de refs, fsck...)
      # a <destination>/<request_id>/evidence/. Falha: BKP_RESULT FAILED (EVIDENCE_UPLOAD_FAILED),
      # que passa a ser o ÚLTIMO BKP_RESULT e substitui o do passo anterior.
      - name: Upload evidence to OneDrive
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SECRETS_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
        run: |
          set -euo pipefail
          rc=0
          python3 backup/scripts/onedrive.py upload --prefix "${DESTINATION}/${REQUEST_ID}/evidence" \
            --result "${RUNNER_TEMP}/onedrive-evidence-upload.json" --files "$EVIDENCE_DIR"/* || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            printf 'BKP_RESULT {"reason": "EVIDENCE_UPLOAD_FAILED", "request_id": "%s", "status": "FAILED"}\n' "$REQUEST_ID"
            exit "$rc"
          fi

      # Apaga o estado local do OneDrive (contém o refresh token corrente), MESMO se o job
      # falhou. O estado vive só na pasta temporária do runner.
      - name: Remove local OneDrive state
        if: always()
        shell: bash
        run: python3 backup/scripts/onedrive.py cleanup

      # Publica a pasta de evidências como artefato do Actions, MESMO se o job
      # falhou (`if: always()`), para que um BLOCKED deixe rastro (preflight.json).
      # Retenção curta (7 dias): a cópia definitiva está no OneDrive.
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bkp-repo-${{ inputs.request_id }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
